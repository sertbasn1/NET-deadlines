name: Check conference deadlines

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deadline-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous deadline snapshot
        uses: actions/cache/restore@v4
        with:
          path: .deadline-monitor-state.json
          key: deadline-monitor-${{ github.run_id }}
          restore-keys: |
            deadline-monitor-

      - name: Check official conference pages
        run: node scripts/check-deadlines.mjs

      - name: Save current deadline snapshot
        uses: actions/cache/save@v4
        with:
          path: .deadline-monitor-state.json
          key: deadline-monitor-${{ github.run_id }}

      - name: Create or update review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('deadline-report.md', 'utf8');
            const needsReview = /Found \*\*\d+ page/.test(report);
            const title = '[Deadline Monitor] Review required';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const footer = `\n\n---\n[View this workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            if (needsReview) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                  body: report + footer,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: report + footer,
                });
              }
            }

      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: deadline-review
          path: deadline-report.md
          retention-days: 30
